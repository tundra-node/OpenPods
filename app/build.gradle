apply plugin: 'com.android.application'

// Signing info for the S6 fork lives in keystore.properties (gitignored)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.dosse.airpods'

    compileSdkVersion 33
    buildToolsVersion '33.0.0'

    defaultConfig {
        applicationId "com.dosse.airpods"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 25
        versionName '2.0.1-s6'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (!keystoreProps.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility = 11
        targetCompatibility = 11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    //noinspection GradleDependency 1.5.0/1.5.1 is broken
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.preference:preference:1.2.0'
    // Material 3 theming (works from API 21; no dynamic color on the S6)
    implementation 'com.google.android.material:material:1.5.0'
}
